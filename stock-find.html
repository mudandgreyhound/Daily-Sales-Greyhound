<!doctype html><html lang="th"><head><meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock Finder — Greyhound Original</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#201c42;--text2:#4b4674;--muted:#6f6b96;--muted2:#9794bd;
  --accent:#6d5efc;--acc-lt:#9b8cff;--acc-bg:rgba(109,94,252,.13);--acc-border:rgba(109,94,252,.3);
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.72);
  --glass-br:rgba(255,255,255,.68);--glass-sh:0 10px 34px -10px rgba(55,40,120,.32);--glass-sh-sm:0 5px 18px -8px rgba(55,40,120,.26);
  --border2:rgba(120,110,180,.28);--line:rgba(120,110,180,.16);
  --green:#15935a;--red:#e0405b;--amber:#c8780f;
  --ground:
    radial-gradient(1100px 680px at 6% -10%, rgba(129,140,248,.55), transparent 60%),
    radial-gradient(920px 640px at 102% -2%, rgba(236,72,153,.30), transparent 58%),
    radial-gradient(1000px 760px at 72% 112%, rgba(34,211,238,.32), transparent 60%),
    radial-gradient(900px 640px at -6% 110%, rgba(167,139,250,.40), transparent 60%),
    linear-gradient(160deg,#eef1fe 0%,#f6f0fb 55%,#eaf4fe 100%);
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --text:#edefff;--text2:#c7c9ef;--muted:#9a9ccb;--muted2:#74769e;
  --accent:#a78bff;--acc-lt:#c4b5fd;--acc-bg:rgba(167,139,255,.16);--acc-border:rgba(167,139,255,.34);
  --glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.045);--glass-strong:rgba(255,255,255,.1);
  --glass-br:rgba(255,255,255,.14);--glass-sh:0 14px 44px -12px rgba(0,0,0,.6);--glass-sh-sm:0 8px 22px -10px rgba(0,0,0,.55);
  --border2:rgba(255,255,255,.12);--line:rgba(255,255,255,.09);
  --green:#34d58a;--red:#ff6b82;--amber:#f0a33c;
  --ground:
    radial-gradient(1100px 680px at 6% -12%, rgba(99,102,241,.42), transparent 60%),
    radial-gradient(920px 640px at 102% -4%, rgba(190,38,120,.34), transparent 58%),
    radial-gradient(1000px 760px at 74% 112%, rgba(14,165,183,.30), transparent 60%),
    radial-gradient(900px 640px at -8% 110%, rgba(124,58,237,.40), transparent 60%),
    linear-gradient(160deg,#0b0920 0%,#120f2e 55%,#0a1226 100%);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--text);background:var(--ground) fixed;min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px;padding-inline:18px;
  background:var(--glass-strong);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--glass-br)}
.tb-left{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--acc-lt));box-shadow:0 4px 14px -2px rgba(109,94,252,.6)}
.tb-title{font-size:13.5px;font-weight:700}.tb-sub{font-size:11px;color:var(--muted)}
.navtabs{display:flex;gap:4px;padding-inline:18px;background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.navtab{padding:12px 18px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.navtab:hover{color:var(--text)}.navtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.page{max-width:1100px;margin:0 auto;padding:22px 18px 64px;display:flex;flex-direction:column;gap:16px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap}
.form-input{flex:1;min-width:220px;border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:15px;padding:12px 16px;outline:none;background:var(--glass2)}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-bg)}
.btn{border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--acc-lt));box-shadow:0 4px 14px -3px rgba(109,94,252,.55)}
.hint{font-size:12px;color:var(--muted)}
.ccard{border-radius:var(--r);padding:16px 20px;background:var(--glass);border:1px solid var(--glass-br);box-shadow:var(--glass-sh);backdrop-filter:blur(20px) saturate(155%);-webkit-backdrop-filter:blur(20px) saturate(155%)}
.item-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.item-name{font-size:15px;font-weight:700;line-height:1.3}
.item-sku{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.item-meta{font-size:11px;color:var(--muted);margin-top:3px}
.item-total{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap}
.item-total small{font-size:11px;color:var(--muted);font-weight:400}
.shops{display:flex;flex-direction:column;gap:7px}
.shop{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--glass-br)}
.shop-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.shop-id{flex:1;min-width:0}
.shop-code{font-family:var(--mono);font-weight:700;font-size:13px}
.shop-name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-tag{font-family:var(--sans);font-size:9px;font-weight:700;color:var(--green);background:rgba(21,197,118,.15);padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
.shop-qty{font-family:var(--mono);font-weight:700;font-size:15px;min-width:40px;text-align:right}
.sizes{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:48%}
.size{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:14px;background:var(--acc-bg);color:var(--accent);border:1px solid var(--acc-border)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--glass-br);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.footer{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style></head><body>

<header class="topbar">
  <div class="tb-left">
    <div class="logo">GH</div>
    <div><div class="tb-title">Stock Finder</div><div class="tb-sub">เสื้อตัวนี้ร้านไหนมี · Greyhound Original</div></div>
  </div>
</header>

<nav class="navtabs">
  <a href="index.html" class="navtab">📊 ยอดขาย</a>
  <a href="stock.html" class="navtab">📦 สต๊อกสินค้า ON NAV</a>
  <a href="stock-find.html" class="navtab on">🔎 สต๊อกสินค้า On Shop</a>
</nav>

<main class="page">
  <div class="searchbar">
    <input class="form-input" id="q" placeholder="พิมพ์ชื่อ/รหัสสินค้า (เช่น shirt, S26MO01)  หรือ  รหัส/ชื่อร้าน (เช่น CCL, Mega)" autofocus>
    <button class="btn" onclick="search()">ค้นหา</button>
  </div>
  <div class="hint" id="hint">พิมพ์ <b>สินค้า</b> → ดูว่าสาขาไหนมี · พิมพ์ <b>รหัสร้าน</b> (เช่น CCL) → ดู stock ทั้งหมดของร้านนั้น</div>
  <div id="results"></div>
  <div class="footer">
    <span>Greyhound Original · Stock Finder</span>
    <span id="gen">—</span>
  </div>
</main>

<script>
const API = "https://greyhound_api.mobile1234.site/api/stock/find";
let _seq = 0, _t = null;
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('th-TH').format(Math.round(Math.abs(n)));
const GROUPS = [
  {k:'shop',c:'#6d5efc',s:new Set(['CLD','SC1','MGB','SHS','SC2','SPM','GPG','SCS','EML','CWV','EMQ','CCL','CLP','CWD'])},
  {k:'website',c:'#0ea5b7',s:new Set(['MEC'])},{k:'tiktok',c:'#e8912a',s:new Set(['TTS'])},
  {k:'shopee',c:'#db2777',s:new Set(['SPX'])},{k:'outside',c:'#8b5cf6',s:new Set(['OL01','OL02','OS04'])},
];
const dotColor = st => (GROUPS.find(g=>g.s.has(st))||{c:'#9794bd'}).c;
const STORE_NAMES = {
  CCL:'FS10-The Circle Ratchapruk',CLD:'FS03-Central Ladprao',CLP:'CDS Central Ladprao',
  CWD:'Central World CDS',CWV:'SmileyHound Central Westville',EML:'FS06-CentralPlaza WestGate',
  EMQ:'Smileyhound Fashion Island',GPG:'FS04-GREYHOUND Siam Paragon',MGB:'FS12-Mega Bangna',
  SC1:'FS01-Siam Center 1',SC2:'FS02-Smileyhound CentralWorld',SCS:'FS15 Seacon Srinakarin',
  SHS:'FS07-Smiley hound Siam Center',SPM:'DC03-Siam paragon SMH',MEC:'Website',
  SPX:'Shopee',TTS:'Tiktok',OL01:'OL01-Outlet Team 1',OL02:'OL02-Outlet Team 2',OS04:'OS04'
};
const storeName = c => STORE_NAMES[c] || '';

async function search(){
  const q = $('q').value.trim();
  if(q.length < 2){ $('results').innerHTML=''; $('hint').textContent='พิมพ์อย่างน้อย 2 ตัวอักษร'; return; }
  const my = ++_seq;
  if(!$('results').innerHTML) $('results').innerHTML = '<div class="spin"></div>';
  $('hint').textContent = `กำลังค้นหา "${q}"...`;
  try{
    const d = await fetch(`${API}?q=${encodeURIComponent(q)}`).then(r=>r.json());
    if(my !== _seq) return;              // ผลเก่ามาช้า ทิ้งไป
    render(d);
  }catch(e){
    if(my !== _seq) return;
    $('results').innerHTML = `<div class="empty">ต่อ API ไม่ได้: ${e.message}</div>`;
    $('hint').textContent = '';
  }
}

function render(d){
  $('gen').textContent = 'ค้นหา ' + new Date().toLocaleString('th-TH');
  if(d.mode === 'store'){ renderStore(d); return; }

  const items = d.items||[];
  if(!items.length){
    $('results').innerHTML = `<div class="empty">ไม่พบสินค้าที่ตรงกับ "${d.query}" (หรือสินค้านั้นหมด stock ทุกสาขา)</div>`;
    $('hint').textContent = '';
    return;
  }
  $('hint').textContent = `พบ ${d.count} รายการ (แสดง ${items.length})`;
  $('results').innerHTML = items.map(it=>`
    <div class="ccard" style="margin-bottom:12px">
      <div class="item-hd">
        <div>
          <div class="item-name">${it.name || it.itemNo}</div>
          ${it.name?`<div class="item-sku">${it.itemNo}</div>`:''}
          <div class="item-meta">${[it.category,it.productGroup].filter(Boolean).join(' · ')} · มี ${it.shops.length} สาขา</div>
        </div>
        <div class="item-total">${fmt(it.total)} <small>ตัว</small></div>
      </div>
      <div class="shops">
        ${it.shops.map(sh=>`
          <div class="shop">
            <span class="shop-dot" style="background:${dotColor(sh.store)}"></span>
            <div class="shop-id">
              <div class="shop-code">${sh.store}${sh.fresh?'<span class="live-tag">สด</span>':''}</div>
              <div class="shop-name">${storeName(sh.store)}</div>
            </div>
            <span class="shop-qty">${fmt(sh.qty)}</span>
            <span class="sizes">${sh.sizes.map(z=>`<span class="size">${z.size}·${z.qty}</span>`).join('')}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// ค้นหาสดขณะพิมพ์ (debounce 300ms)
// STORE MODE — ร้านเดียว โชว์สินค้าทั้งหมด
function renderStore(d){
  const items = d.items||[];
  $('hint').textContent = items.length
    ? `${d.store}${d.storeName?' · '+d.storeName:''} — ${items.length} รายการ · รวม ${fmt(d.total)} ตัว`
    : '';
  if(!items.length){
    $('results').innerHTML = `<div class="empty">${d.store}${d.storeName?' · '+d.storeName:''} ยังไม่มี stock (หรือร้านนี้ยังไม่ได้ดึงข้อมูล)</div>`;
    return;
  }
  const head = `
    <div class="ccard" style="margin-bottom:12px">
      <div class="item-hd" style="margin-bottom:0">
        <div>
          <div class="item-name">${d.store}${d.fresh?'<span class="live-tag">สด</span>':''}</div>
          <div class="item-meta">${d.storeName||''} · ${items.length} รายการ</div>
        </div>
        <div class="item-total">${fmt(d.total)} <small>ตัว</small></div>
      </div>
    </div>`;
  const rows = items.map(it=>`
    <div class="ccard" style="margin-bottom:8px;padding:10px 16px">
      <div class="shop" style="background:transparent;border:none;box-shadow:none;padding:0">
        <div class="shop-id">
          <div style="font-weight:600;font-size:12px">${it.name||it.itemNo}</div>
          ${it.name?`<div class="shop-name" style="font-family:var(--mono)">${it.itemNo}</div>`:''}
        </div>
        <span class="shop-qty">${fmt(it.total)}</span>
        <span class="sizes">${it.sizes.map(z=>`<span class="size">${z.size}·${z.qty}</span>`).join('')}</span>
      </div>
    </div>`).join('');
  $('results').innerHTML = head + rows;
}

$('q').addEventListener('input', ()=>{ clearTimeout(_t); _t = setTimeout(search, 300); });
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(_t); search(); } });
</script>
</body></html>
